<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F9FC">
  <title>ToDone · 创建事项预览</title>
  <link rel="stylesheet" href="/native-theme.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="preview-toolbar" aria-label="本地预览工具">
    <div class="preview-title"><strong>ToDone</strong><span>创建事项 · 本地预览</span></div>
    <div class="preview-controls">
      <div class="view-toggle" aria-label="预览尺寸">
        <button data-action="mobile" aria-pressed="true">手机 390 × 844</button>
        <button data-action="wide" aria-pressed="false">平板 768 × 1024</button>
      </div>
      <button data-action="example">填入示例</button>
      <button data-action="library">已创建 <span id="saved-count">0</span></button>
      <button data-action="tools">演示工具</button>
    </div>
  </header>
  <main class="stage mobile">
    <div class="preview-viewport" id="viewport">
      <section id="app" aria-label="ToDone 应用预览"></section>
      <dialog id="panel" aria-labelledby="panel-title"><div id="panel-content"></div></dialog>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
  </main>
  <footer class="preview-caption">应用区域按 1 CSS px ≈ 1 vp 展示 · 颜色、圆角、间距读取原项目 Theme.ets</footer>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
