<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToDone · Timeline 添加日程 · 冻结稿 v1</title>
<style>body{margin:0}i[data-lucide="paperclip"]::before{content:"📎︎";font-style:normal}</style>
</head>
<body>
<div id="todone-schedule" class="viz-dotted-background" lang="zh-CN">
  <article class="window">
    <div data-el="calendar"><section class="td-draft-cal" aria-label="日程日期">
  <div data-cal-week>
    <div class="td-cal-top">
      <button type="button" class="td-cal-month-toggle" data-cal-open aria-label="展开选日月历" aria-expanded="false"><span data-cal-week-title></span><span aria-hidden="true">⌄</span></button>
      <span class="td-cal-context">时间线</span>
    </div>
    <button type="button" class="td-cal-week" data-cal-week-strip aria-label="选择日期" aria-expanded="false"></button>
  </div>
  <div data-cal-month hidden>
    <div class="td-cal-top">
      <span class="td-cal-context" data-cal-field></span>
      <button type="button" class="td-cal-close" data-cal-close>取消</button>
    </div>
    <div class="td-cal-month-head">
      <strong data-cal-month-title aria-live="polite"></strong>
      <div class="td-cal-arrows">
        <button type="button" aria-label="上个月" data-cal-prev>‹</button>
        <button type="button" aria-label="下个月" data-cal-next>›</button>
      </div>
    </div>
    <div class="td-cal-weeknames" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="td-cal-days" data-cal-days role="group" aria-label="选择日期"></div>
  </div>
</section></div>
    <section class="sheet">
      <div class="handle" aria-hidden="true"></div>
      <form data-el="editor">
        <header><h2 data-el="heading">新建日程</h2><button class="save" data-el="save" type="submit">保存</button></header>
        <div class="fields">
          <input class="name" data-el="title" aria-label="日程名称" placeholder="日程名称" autocomplete="off" required>
          <div data-el="body">
          <div class="times">
            <div class="time-row"><span>开始</span><button type="button" data-el="startDay" value="2026-11-13" aria-expanded="false"></button><button type="button" data-el="startTime" value="14:00" aria-expanded="false">14:00</button></div>
            <div class="time-row"><span>结束</span><button type="button" data-el="endDay" value="2026-11-13" aria-expanded="false"></button><button type="button" data-el="endTime" value="15:00" aria-expanded="false">15:00</button></div>
          </div>
          <div data-el="clockBox" class="clock-box" hidden><div class="clock-head"><span data-el="clockTitle"></span><button type="button" data-el="finishTime">完成</button></div><div data-el="wheel"><div class="td-clock" role="group" aria-label="选择时间">
  <div class="td-clock-column" role="spinbutton" tabindex="0" aria-label="小时" aria-valuemin="0" aria-valuemax="23" data-wheel-unit="hour"></div>
  <span class="td-clock-separator" aria-hidden="true">:</span>
  <div class="td-clock-column" role="spinbutton" tabindex="0" aria-label="分钟" aria-valuemin="0" aria-valuemax="59" data-wheel-unit="minute"></div>
</div></div></div>
          <div class="duration" data-el="duration">共 1 小时</div>
          <div class="labels"><span class="muted">标签</span><div class="chips" data-el="chips"></div><button type="button" class="plus" aria-label="查看全部标签" aria-expanded="false" aria-controls="td-all-tags" data-el="tagToggle">＋</button></div>
          <div class="opts">
            <label><span aria-hidden="true">↻</span> 重复<select data-el="repeat"><option>不重复</option><option>每天</option><option>仅工作日</option><option>每周</option><option>每月</option></select></label>
            <small class="repeat-preview" data-el="repeatPreview" hidden></small>
            <label><span aria-hidden="true">◷</span> 提醒<select data-el="reminder"><option value="">不提醒</option><option value="0">开始时</option><option value="5">提前 5 分钟</option><option value="10">提前 10 分钟</option><option value="15">提前 15 分钟</option><option value="30">提前 30 分钟</option><option value="60">提前 1 小时</option><option value="1440">提前 1 天</option></select></label>
          </div>
          <div class="notes-head"><label for="td-sched-notes">备注</label><button type="button" class="attach" data-el="attach" aria-label="添加附件" aria-expanded="false"><i data-lucide="paperclip" aria-hidden="true"></i><span>附件</span></button></div>
          <textarea id="td-sched-notes" data-el="notes" rows="1" placeholder="添加备注"></textarea>
          <div class="sub" data-el="attachmentBox" hidden><div class="attachments-actions"><button type="button" data-el="pick">选择文件、图片或音频</button><button type="button" data-el="showUrl">添加网址</button></div><input type="file" data-el="files" multiple hidden><div class="url-row" data-el="urlBox" hidden><input type="url" data-el="url" placeholder="https://" aria-label="附件网址"><button type="button" data-el="addUrl">加入备注</button></div></div>
          <ul class="files" data-el="fileList"></ul><div class="err" role="alert" data-el="error"></div>
          </div>
        </div>
      </form>
      <form class="tag-page" data-el="tagPage" hidden>
        <header><button type="button" class="back" data-el="tagBack">返回</button><h2>新建标签</h2><button type="submit" class="save">保存</button></header>
        <div class="fields">
          <label class="field-label" for="td-new-tag-name">标签名称</label>
          <input id="td-new-tag-name" class="name" data-el="tagName" placeholder="例如 🎓 答辩" autocomplete="off" required>
          <fieldset class="color-field"><legend class="field-label">颜色</legend><div class="palette" data-el="palette"></div></fieldset>
          <div class="err" data-el="tagError" role="alert"></div>
        </div>
      </form>
      <section data-el="result" hidden><header><h2>已加入时间线</h2><button type="button" data-el="edit">编辑</button></header><div class="fields"><div data-el="savedDate" class="muted"></div><div class="slip" data-el="slip"><b data-el="savedTitle"></b><span data-el="savedTime"></span><small data-el="savedTag"></small></div><div class="summary" data-el="summary"></div></div></section>
    </section>
    <div class="tag-popup" data-el="tagPopup" id="td-all-tags" role="group" aria-label="全部标签" hidden>
      <div data-el="allTags" class="all-tags"></div>
      <button type="button" class="create-tag" data-el="createTag"><span aria-hidden="true">＋</span>新建标签</button>
    </div>
  </article>
</div>
<style>

#todone-schedule .palette{display:flex;flex-wrap:wrap;margin-top:8px;gap:3px}

#todone-schedule .attach{display:flex;align-items:center;gap:4px;background:var(--paper);font-size:13px;color:var(--secondary)}#todone-schedule .attach svg{width:16px;height:16px}
#todone-schedule .sub input{display:block;width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
#todone-schedule textarea{display:block;width:100%;background:transparent;border:0;box-shadow:none;border-radius:0;padding:6px 0 12px;resize:none;min-height:42px;overflow:hidden;line-height:1.55}

#todone-schedule :is(input[placeholder],textarea[placeholder]):focus::placeholder{opacity:0}
#todone-schedule input.name:focus-visible{border-bottom-color:var(--secondary)}
#todone-schedule .url-row input:focus{border-color:transparent;border-bottom-color:var(--secondary)}
#todone-schedule .notes-head:has(+textarea:focus) label{color:var(--ok);text-decoration:underline;text-underline-offset:4px}
#todone-schedule [data-el=body]:not([hidden]){animation:td-form-return .18s ease-out}
@keyframes td-form-return{from{opacity:.78;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#todone-schedule [data-el=body]{animation:none!important}}
#todone-schedule .sub{background:var(--chip);padding:9px;border-radius:8px;margin:6px 0;font-size:13px}
#todone-schedule .sub button,#todone-schedule .sub select{background:var(--paper)}#todone-schedule .url-row{display:flex;align-items:end;gap:5px}#todone-schedule .url-row input{flex:1;min-width:0}
#todone-schedule .url-row{margin-top:7px}
#todone-schedule .files{list-style:none;padding:0;margin:4px 0}

@media(pointer:coarse){#todone-schedule button,#todone-schedule select{min-height:44px}#todone-schedule textarea,#todone-schedule .sub input{font-size:16px}}
#todone-schedule .td-draft-cal{padding:6px 13px 9px;color:var(--ink);user-select:none;-webkit-user-select:none}
#todone-schedule .td-draft-cal [hidden]{display:none!important}
#todone-schedule .td-draft-cal .td-cal-top,#todone-schedule .td-draft-cal .td-cal-month-head,#todone-schedule .td-draft-cal .td-cal-arrows{display:flex;align-items:center;justify-content:space-between}
#todone-schedule .td-draft-cal .td-cal-top{margin:0 4px;min-height:31px}
#todone-schedule .td-draft-cal .td-cal-context,#todone-schedule .td-draft-cal .td-cal-close{font-size:13px;color:var(--secondary)}
#todone-schedule .td-draft-cal button.td-cal-month-toggle,#todone-schedule .td-draft-cal button.td-cal-week,#todone-schedule .td-draft-cal button.td-cal-close,#todone-schedule .td-draft-cal .td-cal-arrows button,#todone-schedule .td-draft-cal .td-cal-days button{border:0;background:transparent;color:inherit}
#todone-schedule .td-draft-cal button.td-cal-month-toggle{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;padding:3px 3px 3px 0}
#todone-schedule .td-draft-cal .td-cal-month-toggle span:last-child{color:var(--secondary);font-weight:400}
#todone-schedule .td-draft-cal button.td-cal-week,#todone-schedule .td-draft-cal .td-cal-weeknames,#todone-schedule .td-draft-cal .td-cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;text-align:center}
#todone-schedule .td-draft-cal button.td-cal-week{padding:0;touch-action:pan-x}
#todone-schedule .td-draft-cal .td-cal-week-cell{display:grid;justify-items:center;gap:1px;position:relative;padding:1px 0 4px}
#todone-schedule .td-draft-cal .td-cal-weekday,#todone-schedule .td-draft-cal .td-cal-weeknames{color:var(--secondary);font-size:12px}
#todone-schedule .td-draft-cal .td-cal-number{position:relative;display:grid;place-items:center;min-width:32px;height:32px;border-radius:50%;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
#todone-schedule .td-draft-cal .td-cal-selected .td-cal-number{background:var(--ink);color:var(--paper)}
#todone-schedule .td-draft-cal .td-cal-today .td-cal-number::after{position:absolute;bottom:2px;width:3px;height:3px;border-radius:50%;background:currentColor;content:""}
#todone-schedule .td-draft-cal .td-cal-month-head{margin:0 0 4px 4px}#todone-schedule .td-draft-cal .td-cal-month-head strong{font-size:19px;font-weight:600}
#todone-schedule .td-draft-cal .td-cal-arrows{gap:2px}#todone-schedule .td-draft-cal .td-cal-arrows button{width:37px;height:36px;font-size:23px;line-height:1;padding:0}
#todone-schedule .td-draft-cal .td-cal-weeknames{padding:5px 0}
#todone-schedule .td-draft-cal [data-cal-month]{touch-action:pan-x}
#todone-schedule .td-draft-cal .td-cal-days button{display:grid;place-items:center;min-width:0;min-height:35px;padding:0;border-radius:8px}
#todone-schedule .td-draft-cal .td-cal-days .td-cal-outside{color:var(--secondary)}
#todone-schedule .td-draft-cal button:disabled{opacity:1}#todone-schedule .td-draft-cal button:disabled span[aria-hidden=true]{visibility:hidden}
@media(pointer:coarse){#todone-schedule .td-draft-cal .td-cal-days button,#todone-schedule .td-draft-cal .td-cal-arrows button,#todone-schedule .td-draft-cal button.td-cal-month-toggle,#todone-schedule .td-draft-cal button.td-cal-close{min-height:44px}#todone-schedule .td-draft-cal .td-cal-arrows button{min-width:44px}}
.td-clock {
  --wheel-row: 38px;
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr);
  align-items: center;
  max-width: 260px;
  margin: 0 auto;
  font-variant-numeric: tabular-nums;
  user-select: none;
  -webkit-user-select: none;
}
.td-clock::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: 100%;
  height: var(--wheel-row);
  top: var(--wheel-row);
  border-radius: 10px;
  background: var(--chip);
}
.td-clock-column {
  height: calc(3 * var(--wheel-row));
  overflow-y: auto;
  overscroll-behavior-y: contain;
  touch-action: pan-y;
  scrollbar-width: none;
  scroll-snap-type: y mandatory;
  cursor: ns-resize;
  border-radius: 8px;
}
.td-clock-column::-webkit-scrollbar { display: none; }
.td-clock-column::before, .td-clock-column::after {
  display: block;
  content: "";
  height: var(--wheel-row);
}
.td-clock-column[data-dragging] { scroll-snap-type: none; }
.td-clock-column:focus-visible { outline: 2px solid var(--ok); outline-offset: -2px; }
.td-clock-row {
  display: grid;
  place-items: center;
  height: var(--wheel-row);
  scroll-snap-align: center;
  color: var(--secondary);
  font-size: 18px;
}
.td-clock-row.is-current { color: var(--ink); font-size: 22px; font-weight: 600; }
.td-clock-separator { color: var(--ink); font-size: 19px; text-align: center; }
@media (pointer: coarse) { .td-clock { --wheel-row: 44px; } }
</style>
<script>
(()=>{
  function createDraftCalendar(host,{onSelect,onClose,onOpen}) {
  const find=key=>host.querySelector('[data-cal-'+key+']');
  const week=find('week'), strip=find('week-strip'), month=find('month'), days=find('days');
  const weekdays=['一','二','三','四','五','六','日'];
  const iso=d=>[String(d.getFullYear()).padStart(4,'0'),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const parse=s=>new Date(s+'T12:00:00');
  const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12);
  const weekIndex=d=>(d.getDay()+6)%7;
  const monthStart=d=>new Date(d.getFullYear(),d.getMonth(),1,12);
  const title=d=>d.getFullYear()+'年'+(d.getMonth()+1)+'月';

    const summary=[];if(el.repeat.value!=='不重复')summary.push('重复 · '+el.repeat.value+(el.repeat.value==='仅工作日'?'（'+el.repeatPreview.textContent+'）':''));
    if(el.reminder.value!==''){
      const remindAt=new Date(timestamp(el.startDay.value,el.startTime.value)-Number(el.reminder.value)*60000);
      const when=remindAt.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
      summary.push('提醒 · '+el.reminder.selectedOptions[0].textContent+'（'+when+'）');
    }
    if(el.notes.value.trim())summary.push('备注 · '+el.notes.value.trim());
    for(const a of attachments)summary.push('附件 · '+a.name);
    el.summary.textContent=summary.join('\n');el.editor.hidden=true;el.result.hidden=false;calendar.setEnabled(false);el.edit.focus();
  };
  el.edit.onclick=()=>{el.result.hidden=true;el.editor.hidden=false;calendar.setEnabled(true);el.heading.textContent='编辑日程';resizeNotes();el.title.focus();};
})();
</script>
</body>
</html>
